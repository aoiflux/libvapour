decisions:
  - rule: "Sector unit 0x200 for image control areas and 0x1000 for data ones, from _MMSECTION_FLAGS.Image"
    justification: "S19 4.3 step 1, M4, M5"
  - rule: "Extent from StartingSector with StartingSector4132, NumberOfFullSectors and SectorEndOffset; UnusedPtes not read"
    justification: "S19 4.3 step 3.4, T4, M4, M5"
  - rule: "First subsection at the control area's end; first mismatch refused, later mismatch, cycle or MaxListEntries cuts the list"
    justification: "S19 4.3 steps 3.1-3.2, M2"
  - rule: "Extent must fit PtesInSubsection and the segment's TotalNumberOfPtes budget"
    justification: "S19 4.3 steps 3.5-3.6, T3, M5"
  - rule: "Prototype PTEs decoded from _MMPTE_HARDWARE and _MMPTE_TRANSITION bit fields in the table"
    justification: "S19 4.3 step 3.7, T5"
date: 2026-11-12
