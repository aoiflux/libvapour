decisions:
  - rule: "ABI layout replaced by the table's members; nil table gives the 8-byte layout"
    justification: "S74 4.5, L3, M1"
  - rule: "Header read through its last member; NULL buffer with Length is an error; text capped at 0xFFFF"
    justification: "S74 4.5, L3, M2, O2"
  - rule: "Unpaired surrogates and a final odd byte become U+FFFD; a high surrogate before the odd byte shares it"
    justification: "S74 4.6, U1, U2, U5, O11"
  - rule: "Trailing NULs dropped, inner NULs shown as U+2400"
    justification: "S74 4.5, U7"
