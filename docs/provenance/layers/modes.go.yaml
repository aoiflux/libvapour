decisions:
  - rule: "Four presets: x64 and la57 with 8-byte entries and frame field 51:12, PAE with a 31:5 root, 32-bit with PSE-36"
    justification: "S53 4.1, P1, P4, P5, A5, W1, W2, M3"
  - rule: "The zero mode is 4-level paging"
    justification: "S53 4.1"
  - rule: "LinuxMode reads present entries only; frame field below MAX_PHYSMEM_BITS less the SME bit"
    justification: "S53 4.1, X2-X6"
  - rule: "Canonical addresses repeat the top address bit"
    justification: "S53 P8"
