decisions:
  - rule: "MZ at 0, e_lfanew at 0x3C, PE signature, 20-byte file header, PE32 or PE32+ magic"
    justification: "S72 4.1 steps 1-3, P1-P3"
  - rule: "SizeOfOptionalHeader must reach the data directories (96 or 112 bytes)"
    justification: "S72 4.1 step 4, P4-P6, M1"
  - rule: "A short buffer reports the length the next stage needs"
    justification: "S72 4.1, M1"
  - rule: "Section names are the raw bytes up to the first NUL or all 8"
    justification: "S72 4.1 step 6, P6"
  - rule: "Directory entry counts when below NumberOfRvaAndSizes and inside SizeOfOptionalHeader"
    justification: "S72 4.2, P5, P6, M1"
