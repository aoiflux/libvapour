decisions:
  - rule: "Record wins over an enumeration of its name"
    justification: "S58 4.6, F5"
  - rule: "Names sized by the table's platform; ErrPlatformUnknown from FieldSize and SizeOf, Unsized in ReadStruct"
    justification: "S58 4.4 step 4, V13"
  - rule: "No width guessed: unknown widths unsized; SizeOf takes expressions"
    justification: "S58 4.4, 4.6, V8, O4"
  - rule: "Integers: pointers, bitfields ending by bit 64, named types up to 8 bytes that are not records, floats or big-endian"
    justification: "S58 4.5 steps 1-3, V10-V12, F4"
