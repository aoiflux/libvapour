decisions:
  - rule: "Seeds are the seven SYMBOL() values; any missing refuses the note"
    justification: "S75 4.8 step 1, L1"
  - rule: "Count as 4 bytes, 1 to MaxTableEntries; base as 8 bytes"
    justification: "S75 4.8 steps 2-3, L2, M2"
  - rule: "Records: one count byte, a second when bit 7 is set; expansion within MaxNameBytes"
    justification: "S75 4.8 step 6, L3, L4, M5"
  - rule: "_stext decides between the two address rules; exactly one must match"
    justification: "S75 4.8 step 7, L1, L5, M3, M4"
  - rule: "Addresses must be in order"
    justification: "S75 4.8 step 8, L6, M4, O6"
  - rule: "Size to the next greater address; last group to _einittext, _end or _etext; unrepresentable sizes 0"
    justification: "S75 4.8 step 9, L6, M8, O5"
