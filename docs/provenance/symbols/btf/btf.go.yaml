decisions:
  - rule: "Header: magic in either byte order, version 1, flags 0, hdr_len at least 24, zero tail"
    justification: "S75 4.9 step 1, L12, L13"
  - rule: "Type section at 0, strings directly after it ending the blob, NUL first and last"
    justification: "S75 4.9 step 2, L13, M10"
  - rule: "Record info mask, kinds 1 to 19, name offsets, trailing data per kind, INT data rules, zero size word for ARRAY and FWD"
    justification: "S75 4.9 step 3, L14, L15"
  - rule: "Every referenced type id exists"
    justification: "S75 4.9 step 4"
  - rule: "Kernel span 1 to MaxKernelImageBytes, read whole"
    justification: "S75 4.9 step 5, L11, M10"
