decisions:
  - rule: "C type names as specifier multisets under the Microsoft sizes; fixed-width and __intN names"
    justification: "S58 4.4 step 2, F10-F12, O3"
  - rule: "long, long double and wchar_t sized by the table's platform: Windows LLP64, Linux LP64 or ILP32; unknown platform an error, not a guess"
    justification: "S58 4.4 step 4, V13, F11, F21, F22, O9"
  - rule: "Enumeration with no width is 4 bytes, 8 past 32 bits"
    justification: "S58 4.4 step 3, F13, F14, O5"
  - rule: "Array width overflow is unknown; little-endian values; bits from the least significant"
    justification: "S58 4.4 step 1, 4.5 step 2, F15-F17, F20"
