decisions:
  - rule: "ENUM values sign-extended only with kind_flag; ENUM64 keeps its bit pattern"
    justification: "S59 4.5, T6, O3, O4"
  - rule: "Bitfields from kind_flag sizes or narrow INTs; kind_flag ints regular"
    justification: "S59 4.5 step 3, T5"
  - rule: "Storage unit aligned to the type's size, else from the field's first byte"
    justification: "S59 4.5 step 4, P1"
  - rule: "Union members at 0, struct offsets non-decreasing, inside the size, non-bitfields on a byte"
    justification: "S59 4.5 steps 5-6, B4, B6"
  - rule: "Unnamed records embedded; other unnamed members are padding"
    justification: "S59 4.5 step 7"
