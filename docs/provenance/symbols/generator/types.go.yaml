decisions:
  - rule: "A typedef names the anonymous type it declares; first in type id order; an anonymous structure or union with no members takes no typedef name"
    justification: "S59 4.4, B8, M15; owner decision 2026-11-12, follow-up L2"
  - rule: "Enumeration constants written by value, then name; forward declarations carry an empty member list"
    justification: "S59 4.14; owner decision 2026-11-12, follow-up L1"
  - rule: "Scalars from INT encodings and FLOAT; disagreeing INTs give none; void always present"
    justification: "S59 4.9, T3"
  - rule: "Forward declarations without a definition are name-only records"
    justification: "S59 4.10, T7"
  - rule: "Typedef aliases: scalar copy, enumeration copy or an embedding record; derived targets unnamed"
    justification: "S59 4.11"
date: 2026-11-12
