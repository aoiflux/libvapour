decisions:
  - rule: "A banner is printable ASCII after 'Linux version ' ending in newline and NUL within MaxNameBytes"
    justification: "S75 4.7 step 1, L7, M12"
  - rule: "The release starts with a digit and holds a dot"
    justification: "S75 4.7 step 2, L9"
  - rule: "Template prefix within 31 bytes after the terminator marks the copy in read-only data"
    justification: "S75 4.7 step 4, M12, O8"
  - rule: "LinuxKernelBanner takes the one such banner; ReadLinuxBanner reads through the NUL"
    justification: "S75 4.7 steps 5-6, L8, M13, M14"
date: 2026-11-12
