decisions:
  - rule: "GUID from stream 1 bytes 12-27; age from the DBI header"
    justification: "S32 4.2 step 1, F3, F12, M5"
  - rule: "DBI header 64 bytes, signature -1, seven non-negative substreams inside the stream in documented order"
    justification: "S32 4.2 step 2, F12, M5"
  - rule: "Module entries read until one does not fit"
    justification: "S32 4.2 step 3, F13"
  - rule: "Original section headers with OMAP when both present, else slot 5; OMAP by largest rva not above, 0 means removed"
    justification: "S32 4.2 step 4, 4.4 step 5, F14-F16, O7"
