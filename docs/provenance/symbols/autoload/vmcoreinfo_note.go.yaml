decisions:
  - rule: "A header or OSRELEASE mismatch is not a note and is skipped silently; any later fault is a damaged copy"
    justification: "S05 5"
  - rule: "A piece of 79 bytes or more is a cut line of 79 bytes; cut lines keep text only"
    justification: "S05 K4, 4.2"
  - rule: "Numeric values must be the exact printf text and fit 64 bits"
    justification: "S05 K8, K9, 4.3"
  - rule: "Layout only for x86-64: DTB = swapper_pg_dir - __START_KERNEL_map + phys_base; KERNELOFFSET a multiple of 2 MiB below the image mapping"
    justification: "S05 K10 to K15, 4.4"
  - rule: "Scan step 4 MiB, descriptor bound the x86 PAGE_SIZE of 4096, capped by MaxBufferBytes, MaxTextBytes and MaxMatchesPerChunk"
    justification: "S05 8, K3, K16; owner decision 2026-11-12, S05 O3"
  - rule: "The release line takes any byte but NUL and escapes bytes outside 0x20 to 0x7e as \\xNN"
    justification: "S05 K17, 4.2; owner decision 2026-11-12, S05 O2"
  - rule: "A backslash in the release is written as two"
    justification: "S05 4.2 step 1; owner decision 2026-11-12, follow-up D1"
  - rule: "Without NUMBER(pgtable_l5_enabled) the depth comes from S04 on the DTB; undecided stays 4-level and is returned as the error"
    justification: "S05 4.5; owner decision 2026-11-12, S05 O1"
date: 2026-11-12
