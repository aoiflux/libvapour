decisions:
  - rule: "Section entries in three forms chosen by the table; form C counted by the null-ended pointer list, which must point at the entries"
    justification: "S08 4.1, E1, E2"
  - rule: "A section outside every live region is dropped; sizes run to the next section or the region end"
    justification: "S08 4.1, E3, E4, O1"
  - rule: "Flags from the region kind; every section SHT_PROGBITS"
    justification: "S08 4.1, O2"
  - rule: "Symbols placed by value into a kept section, else SHN_ABS; locals first"
    justification: "S08 4.2, G5, G6"
  - rule: "Whole file checked against the artefact cap before contents are read"
    justification: "S08 4.4"
