decisions:
  - rule: "List view: walk modules through module.list"
    justification: "S07 4.1, D1"
  - rule: "Sysfs view: walk module_kset->list; a null module_kobject.mod is built-in and skipped"
    justification: "S07 4.2, D2, D3, D4"
  - rule: "Scan view: mod_tree bounds inside the x86-64 module area and under MaxRegionScanBytes; pointer-aligned candidates with state 0-3 and mkobj.mod == self; accepted when placed"
    justification: "S07 4.3, D5, D6, D8, O1"
  - rule: "Identity is the struct module address; hidden = scan minus list; compare_sysfs = both differences"
    justification: "S07 4.4"
