decisions:
  - rule: "Shape from the symbol table: mem[] regions form or core_layout/init_layout form; anything else is unsupported"
    justification: "S06 4.1, F6, F8"
  - rule: "A module reads when its state is 0-3 and its name has a NUL, is not empty and is printable non-space ASCII"
    justification: "S06 4.2, F2, F3, O1"
  - rule: "Self-linked (mkobj.mod) and placed (inside core data) are facts on the result, not errors"
    justification: "S06 4.2, F4, F5"
  - rule: "Layout end offsets split a layout into text, rodata, ro_after_init and data; out of order gives one region"
    justification: "S06 4.3, F7"
  - rule: "SeparateRegions reports the module.mem form, whose regions the kernel allocates one by one"
    justification: "owner decision 2026-11-12, S55 O5; S06 F8"
date: 2026-11-12
