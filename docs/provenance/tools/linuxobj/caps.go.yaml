sources:
  - title: "Linux kernel source, include/uapi/linux/capability.h, include/linux/capability.h, include/linux/cred.h, kernel/sysctl.c, kernel/cred.c, fs/proc/array.c at v4.19, v6.1, v6.4, v6.14, v6.17"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/
