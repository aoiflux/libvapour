    path: corefacts
    accessed: 2026-11-12
decisions:
  - rule: "CAP_* names by number from include/uapi/linux/capability.h"
    justification: "S46 P1"
  - rule: "A set is 8 little-endian bytes in both kernel_cap_t layouts"
    justification: "S46 4.4 step 1, P2"
  - rule: "The full set is from cap_last_cap, else init_cred.cap_bset, else the names"
    justification: "S46 4.4 step 2, P3, P4"
  - rule: "Text: CAP_FULL_SET, empty, or names with unnamed bits in hex"
    justification: "S46 4.4 step 3"
