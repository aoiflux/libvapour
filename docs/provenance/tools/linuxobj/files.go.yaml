decisions:
  - rule: "A descriptor table over MaxTableEntries is refused; a slot that does not read cuts the table with an error"
    justification: "S39 4.1 steps 1-2, F1, F2"
  - rule: "Open-file paths use f_path; mapped files use the backing file's user_path when FMODE_BACKING is set"
    justification: "S39 4.1 step 4, F3, F5"
  - rule: "Inode type and mode text from the S_IF bits and the ls long format"
    justification: "S39 I3, I4"
  - rule: "Inode times from either layout, I_CTIME_QUERIED masked, nanoseconds below 10^9"
    justification: "S39 4.1 step 6, I1, I2"
  - rule: "Superblock device, type and options as mountinfo prints them"
    justification: "S39 I5-I7"
