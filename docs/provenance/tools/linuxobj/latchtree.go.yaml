decisions:
  - rule: "Copy chosen by sequence & 1; walk left on negative, right on positive"
    justification: "S38 4.4, L1-L5"
  - rule: "Revisited node and MaxRecursionDepth end the walk"
    justification: "S38 4.4 step 3, L6"
  - rule: "mod_tree used only inside addr_min..addr_max (and the data bounds when typed); nodes compared by region base and size"
    justification: "S38 4.3, M2, M3, M5"
  - rule: "A tree module that does not hold the address is refused"
    justification: "S38 4.3 step 4, M5"
