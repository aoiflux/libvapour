decisions:
  - rule: "Page owner type is folio when it has flags, mapping and index, else page"
    justification: "S12 4.5 step 1, P4"
  - rule: "Struct page array base from vmemmap_base, else the documented 4- or 5-level base, with the documented span"
    justification: "S12 4.5 step 1, P8, P9"
  - rule: "An entry must lie on the array, read, and its owner (head via compound_head bit 0) must hold this mapping and the slot's index"
    justification: "S12 4.5 step 3, P2, P3, P5"
  - rule: "A head stands for tail pages whose compound_head is head + 1, bounded by 2^11, the next entry and the file size"
    justification: "S12 4.5 step 4, P3, P10"
  - rule: "Frames from the physical layer, else the direct map at page_offset_base"
    justification: "S12 4.5 step 5, P7, P9"
  - rule: "Flag names only for bits below __NR_PAGEFLAGS, every alias"
    justification: "S12 4.5 step 6, P6, O7"
date: 2026-11-12
