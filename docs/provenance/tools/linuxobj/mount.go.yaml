decisions:
  - rule: "The path walk crosses each mount at its root to its mount point and ends at the root, a namespace root, detached or escaped"
    justification: "S39 4.3, P1, P2, P5"
  - rule: "Namespace mounts from the rb-tree in order, each child naming its parent; else from the list"
    justification: "S39 4.6 step 1, N1, N2"
  - rule: "Shared and unbindable from mnt_t_flags when present, else mnt_flags"
    justification: "S39 4.6 step 4, N4"
  - rule: "The dominating peer group follows the master chain and peer rings, bounded by MaxListEntries"
    justification: "S39 4.6 step 6, N6"
  - rule: "The task's root must read before paths are built from it"
    justification: "S39 4.6 step 5"
date: 2026-11-12
