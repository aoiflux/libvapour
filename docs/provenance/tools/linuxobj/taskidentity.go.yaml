decisions:
  - rule: "Thread ID is task_struct.pid, process ID is tgid, both signed pid_t in the initial namespace"
    justification: "S14 4.1 step 1, I1, I2"
  - rule: "Parent ID is the real parent's tgid; a null real_parent is 0, not an error"
    justification: "S14 4.1 step 2, I5, I6, I7"
  - rule: "Name is comm up to its first NUL; a name with no NUL is taken whole"
    justification: "S14 4.2, 5, N1-N3"
  - rule: "Kernel thread is PF_KTHREAD alone, not a null mm"
    justification: "S14 4.3, K1-K4"
  - rule: "Decoration marks kernel threads [name] and non-leader threads {name}"
    justification: "S14 4.2 step 4, O1"
  - rule: "PID filter keeps a leader whose tgid is in the session PID set"
    justification: "S14 4.1 step 3"
