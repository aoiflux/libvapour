decisions:
  - rule: "IPv4 addresses follow ifa_list and ifa_next to null; the address is ifa_local"
    justification: "S40 4.3 step 1, A1, A2"
  - rule: "IPv6 addresses are the addr_list walk over inet6_ifaddr.if_list"
    justification: "S40 4.3 step 2, A3"
  - rule: "A walk keeps the addresses read and ends revisited, capped or entry unreadable"
    justification: "S40 4.3 step 3, 5, 8"
  - rule: "Hardware addresses are written as %*phC: lower-case hex separated by colons"
    justification: "S40 D10"
date: 2026-11-12
