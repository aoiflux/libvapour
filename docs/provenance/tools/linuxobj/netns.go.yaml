decisions:
  - rule: "Namespaces are the net_namespace_list walk over net.list; the number is net.ns.inum"
    justification: "S40 4.1, N1-N3, N6"
  - rule: "A task with a null nsproxy holds no namespace and is not an error"
    justification: "S40 4.1 step 3, N4"
  - rule: "Devices are the dev_base_head walk over net_device.dev_list"
    justification: "S40 4.2 step 1, D1"
  - rule: "A device record is read identity, namespace, state words, sizes, addresses, qdisc, protocol pointers"
    justification: "S40 4.2 step 2"
  - rule: "The device namespace is nd_net.net, or init_net when possible_net_t is empty"
    justification: "S40 4.2 step 3, N5"
  - rule: "The hardware address is addr_len bytes at dev_addr; addr_len over 32 makes it absent"
    justification: "S40 4.2 step 4, D2, D3, D9"
  - rule: "Reported flags recompute the running, carrier and dormant bits as dev_get_flags"
    justification: "S40 4.2 step 6, D4-D6"
  - rule: "Promiscuous is IFF_PROMISC in the stored flags"
    justification: "S40 4.2 step 7"
