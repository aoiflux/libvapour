decisions:
  - rule: "The address width is 32 with 4-byte pointers, 57 under la57 and 48 otherwise; Canonical sign-extends from the top kept bit"
    justification: "S46 4.1 step 1, K2, K3"
  - rule: "Integer width is the base type's under the kernel data model, else the table's member width, else the type size"
    justification: "S46 4.1 step 2, K5"
  - rule: "Int sign-extends unless the member type is unsigned"
    justification: "S46 4.1 step 2, K6"
  - rule: "Deref is set and readable over the pointee's size"
    justification: "S46 4.1 step 3"
  - rule: "StringAt reads a page at a time and stops at NUL or the count"
    justification: "S46 4.1 step 5"
  - rule: "The module model is built once per Kernel from the shared S06 model"
    justification: "S46 4.1 step 7"
