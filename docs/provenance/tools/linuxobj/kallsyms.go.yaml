decisions:
  - rule: "Core table decoded by symbols/kallsyms from the symbol table's kallsyms_* addresses"
    justification: "S38 4.1, K3-K5"
  - rule: "A symbol outside both text ranges marks an --all-symbols table and widens the core range to _end and the init section"
    justification: "S38 4.1 steps 3-4, K2, K7"
  - rule: "Core answer: last position not above the address, moved back over equal addresses; an empty name ends the lookup"
    justification: "S38 4.2 step 1, K8, K9"
  - rule: "Lookup order core, module, BPF, ftrace functions, then ftrace trampolines"
    justification: "S38 4.2, K9, R4"
  - rule: "Module symbol: largest qualifying value not above the address; size to the next value or the end of text"
    justification: "S38 4.2 step 2, M6, M9"
  - rule: "BPF compare includes end for bpf_ksym, excludes it for the v4.19 region"
    justification: "S38 4.6, B2, B4, O4"
date: 2026-11-12
