decisions:
  - rule: "Kernel threads and tasks with a null mm have no layer and are not reported"
    justification: "S14 4.5 steps 1-2, K3, K4, A2"
  - rule: "No translator in the kernel layer is an error, not a reason"
    justification: "S14 4.5 step 3"
  - rule: "Root is the physical address of mm->pgd through the kernel layer"
    justification: "S14 4.5 step 5, A4"
  - rule: "Root aligned to 4 KiB on 64-bit tables, 32 bytes on 32-bit ones"
    justification: "S14 4.5 step 6, A3, A6, section 9"
