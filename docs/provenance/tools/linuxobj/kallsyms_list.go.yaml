decisions:
  - rule: "Module symbols in modules-list order, unformed modules and empty names skipped"
    justification: "S38 4.5, M7, K11"
  - rule: "Exported when the module's kernel_symbol table has the name with the same value; letter upper-case when exported"
    justification: "S38 4.5, M8, K11"
  - rule: "kernel_symbol offsets are relative to their own member"
    justification: "S38 M8"
  - rule: "ftrace functions listed once each, type T, exported; trampolines with a non-zero address, type t"
    justification: "S38 4.7, R1, R3, R4, O2"
  - rule: "BPF symbols from bpf_kallsyms in list order, type t, module bpf; v4.19 names from tag and aux name"
    justification: "S38 4.6, B1, B3, B4"
