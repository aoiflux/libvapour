decisions:
  - rule: "The core timekeeper is tk_core or element 0 of timekeeper_data"
    justification: "S46 4.2 step 1, C1"
  - rule: "Placement from the declared type, tk_data, or after the sequence counter"
    justification: "S46 4.2 step 2, C2, C3"
  - rule: "Boot time is offs_real less offs_boot in UTC"
    justification: "S46 4.2 step 3, C5"
  - rule: "wall_to_monotonic and monotonic_to_boot are checks; an odd sequence is an update in progress"
    justification: "S46 4.2 steps 4-6, C4, C5"
  - rule: "Creation time is boot plus start_boottime or real_start_time"
    justification: "S46 4.3 step 1, C8"
  - rule: "A namespace's boot time is the host's less offsets.boottime; a timespec outside the kernel's range is refused"
    justification: "S46 4.3 steps 2-3, C6, C7"
date: 2026-11-12
