decisions:
  - rule: "ELF32 and ELF64 little-endian only; other classes and encodings refused"
    justification: "S38 4.8 step 1, E1"
  - rule: "Program header entries at least the class size"
    justification: "S38 4.8 step 2, E3, E6"
  - rule: "Base address from the lowest PT_LOAD, truncated to 4096"
    justification: "S38 4.8 step 3, E4, E7"
  - rule: "Library list from DT_DEBUG, four pointer fields per entry, walk stops at 0, revisit or cap"
    justification: "S38 4.8 steps 4-5, E5, S2, O6, O8"
