decisions:
  - rule: "Walk shapes for 4-level, 5-level, PAE and 32-bit paging"
    justification: "S46 4.6 step 1, G2"
  - rule: "The frame mask is physical_mask, else the __PHYSICAL_MASK_SHIFT default"
    justification: "S46 4.6 step 3, G3"
  - rule: "A not-present entry is a fault over its span; PS where no page maps is a reserved fault"
    justification: "S46 4.6 step 4, G1, G4"
  - rule: "Tables are cached whole, PTECacheEntries/512 of them"
    justification: "S46 section 8"
  - rule: "Dirty is D in a present leaf; ReadPadded zero-fills and counts"
    justification: "S46 4.6 step 5, G1"
