decisions:
  - rule: "No installed event: no source gives one"
    justification: "owner decision 2026-11-12, follow-up D16 (S60 O3)"
  - rule: "One entry per dated event: time (UTC), event class, tool, source field, subject, virtual and physical address"
    justification: "S60 7"
  - rule: "Total order: time, tool, field, subject, address, physical, event; stable for entries equal in every field"
    justification: "S60 4 step 6, M4"
  - rule: "Times before 1970 have no seconds-since-the-epoch value"
    justification: "S60 D1"
  - rule: "SourceSummary has no malformed count: no source gives a text time"
    justification: "owner decision 2026-11-12, S60 O6"
