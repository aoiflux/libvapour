decisions:
  - rule: "Process rows are the S01 process walk without threads, in walk order, with the PID filter applied by the walk"
    justification: "S14 4.7 step 1, 4.1 step 3"
  - rule: "A row is the task's tgid, undecorated comm and address"
    justification: "S14 4.7 step 1, 4.1 step 1, 4.2"
  - rule: "A task whose tgid or comm does not read is left out with a diagnostic; strict mode makes it, and a walk that left tasks out, an error"
    justification: "S14 4.7 step 1, S01 4.4"
  - rule: "Unconfirmed cross-check rows are dropped; a failing cross-check keeps the row unless strict"
    justification: "S14 4.7 step 1"
date: 2026-11-12
