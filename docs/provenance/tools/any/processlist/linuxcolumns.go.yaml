decisions:
  - rule: "Columns from the task summary; threads follow their process in thread-walk order"
    justification: "S14 4.7 steps 3-4"
  - rule: "A thread row's PID is its thread ID and its name the undecorated comm"
    justification: "S14 4.7 step 4"
  - rule: "Each failure kind reported once with its first task and once with the count"
    justification: "S14 4.7 step 5, section 6"
  - rule: "Strict mode refuses only failures with no mark in the row"
    justification: "S14 4.7 step 6"
  - rule: "PPIDRead marks a parent that did not read; that failure is marked and stays a diagnostic in strict mode"
    justification: "owner decision 2026-11-12, S14 O3"
