decisions:
  - rule: "Capture window from KeBootTime less the magnitude of KeBootTimeBias to KUSER_SHARED_DATA.SystemTime plus 24 hours; fallbacks 1 and 2^63-1"
    justification: "S17 4.1, 4.4, M3, F2, F6; allowance and boot-time symbols accepted by the owner 2026-11-12"
  - rule: "PID, TID and CID process ID nonzero, a multiple of 4, at most 0xFFFFFFFC"
    justification: "S17 4.2 step 2, 4.3, F3, F4, M2, M4"
  - rule: "No time exemption for any process; System threads skip only the lower time bound"
    justification: "S17 4.2 step 3, 4.3 step 3, M3, M4"
  - rule: "Page-table frame nonzero and below the physical size, or below 2^52 without physical memory; bits 11:0 ignored"
    justification: "S17 4.2 step 5, F7, M5"
  - rule: "Each thread-list link is the head itself or in system space; links are not followed"
    justification: "S17 4.2 step 6, F5, F8, M5"
  - rule: "Checks return bare sentinels; callers add the tool and address"
    justification: "S17 section 6"
date: 2026-11-12
