decisions:
  - rule: "A Linux banner is the prefix, a release token of 1 to 64 bytes in 0x21-0x7E, then a space and an opening parenthesis; the text runs to newline, NUL or a non-printable byte, at most MaxNameBytes"
    justification: "S47 4.2 step 4, B1, B2"
  - rule: "Version is the text from the # after the last closing parenthesis followed by a space and #"
    justification: "S47 4.2 step 4, B3, B4, M8"
  - rule: "A Windows record is RSDS, GUID, age and a NUL-terminated path under 260 bytes naming a kernel PDB"
    justification: "S47 4.2 step 5, B6, B7, B8"
  - rule: "The running copy is the physical address of linux_banner, or of KernelBase plus the CodeView AddressOfRawData"
    justification: "S47 4.2 step 2, B6, M6, M7"
  - rule: "Scan windows of MaxBufferBytes overlapping by MaxNameBytes; at most MaxMatchesPerChunk hits per window"
    justification: "S47 4.2 step 3, 8"
