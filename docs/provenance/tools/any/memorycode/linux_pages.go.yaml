decisions:
  - rule: "Present entry: resident; executable when bit 63 is clear; written when bit 6 is set, or bit 58 from release 6.14"
    justification: "S47 4.1 step 10, L4, L5"
  - rule: "Not-present entries count as nothing"
    justification: "S47 4.1 step 10, O2"
  - rule: "A miss above the leaf skips its span; at most MaxRegionScanBytes / 4096 entries per area"
    justification: "S47 4.1 step 10, 8"
