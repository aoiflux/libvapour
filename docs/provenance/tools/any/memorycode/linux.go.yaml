decisions:
  - rule: "Candidates by vm_flags: writable-executable (VM_EXEC and VM_WRITE), anonymous-executable (VM_EXEC, no vm_file, not a special mapping), written-file-executable (VM_EXEC, a file, no VM_WRITE, a written page), page-executable (no VM_EXEC, NX in use, a present page with NX clear)"
    justification: "S47 4.1 steps 12-15, L1, L3, L6, L7, M2, M3"
  - rule: "Special mappings are told apart by vm_ops equal to special_mapping_vmops or legacy_special_mapping_vmops"
    justification: "S47 4.1 step 5, L7"
  - rule: "The kernel release from linux_banner decides whether bit 58 marks a written page"
    justification: "S47 4.1 step 6, B1, L5"
  - rule: "An area is listed only when an executable page reads and holds a nonzero byte"
    justification: "S47 4.1 step 17, S35 4.5"
  - rule: "Header ELF by magic and EI_CLASS, else the S35 PE kinds; first transfer by S35 4.8 in 64-bit mode; preview and dump as S35"
    justification: "S47 4.1 steps 18-20, L8"
  - rule: "Protection printed as /proc/<pid>/maps prints it"
    justification: "S47 L2"
date: 2026-11-12
