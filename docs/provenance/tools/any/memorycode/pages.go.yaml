decisions:
  - rule: "Present entry: resident, executable when bit 63 is clear, written when bit 6 is set"
    justification: "S35 4.3 step 3, D7, T1"
  - rule: "Not-present entry: prototype and zero have no protection of their own; transition and software forms give MmProtectToValue[Protection]"
    justification: "S35 4.3 step 4, T2, T4, M2"
  - rule: "A page without its own protection takes the VAD's"
    justification: "S35 4.3 step 5, O2"
  - rule: "A miss above the leaf skips that entry's span; at most MaxRegionScanBytes / 4096 leaf entries per region"
    justification: "S35 4.3 steps 1-2, 8"
