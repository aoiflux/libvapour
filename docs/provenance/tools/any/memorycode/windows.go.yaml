decisions:
  - rule: "Candidates are private and mapped VADs; image and unknown kinds are not"
    justification: "S35 4.2 step 5, D1, O3"
  - rule: "allocation-executable when the VAD protection holds an execute value; page-executable when it does not and a page's own protection does"
    justification: "S35 4.4, D1, D2, D3, D4, M2, M3"
  - rule: "A region is listed only when an executable page reads and holds a nonzero byte; the others are counted in one diagnostic"
    justification: "S35 4.5, D3, M5"
  - rule: "User reads only through the process's own address space; a process without one, or without leaf entries, is skipped with a diagnostic"
    justification: "S35 4.2 steps 2-3"
  - rule: "Backing from the section's control area: file, section, unknown; none for private memory"
    justification: "S35 4.6, M6"
  - rule: "Instruction mode 32-bit for a WoW64 process"
    justification: "S35 4.2 step 4"
  - rule: "Preview length from any.memory.find_code.hexdump_size, at most MaxArtifactBytes; dump through extract to output_dir below the dump limit"
    justification: "S35 4.9, 4.10"
date: 2026-11-12
