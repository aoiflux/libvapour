decisions:
  - rule: "Subsection read only for a section view"
    justification: "S24 4.6 step 2, T3, T4"
  - rule: "Control area File must be set when the table places it"
    justification: "S24 4.6 step 3, T10"
  - rule: "FilePointer with the _EX_FAST_REF.RefCnt bits cleared; 4 or 3 bits without the type"
    justification: "S24 4.6 step 4, S19 T2, O4"
  - rule: "FileName read as a UNICODE_STRING of up to 65,535 bytes"
    justification: "S24 4.6 step 5"
  - rule: "MappedFile.NoFile set only where the VAD is shown to map no file"
    justification: "owner decision 2026-11-12, S24 O8"
