decisions:
  - rule: "Maple nodes walked depth first with their pivots, data end and metadata; dead nodes and wrong parent links dropped and counted"
    justification: "S39 4.7 step 2, T1-T6"
  - rule: "An area kept only when its bounds are aligned, vm_mm is the mm and the stored range is its own"
    justification: "S39 4.7 step 4, A1, A3"
  - rule: "The VMA list followed by vm_next in address order before 6.1"
    justification: "S39 4.7 step 3, A1"
  - rule: "The kept count compared with map_count and reported, not an error"
    justification: "S39 4.7 step 5, A2, X2"
  - rule: "Rows with inclusive ends, rwx from VM_READ/WRITE/EXEC, offset vm_pgoff << 12, the maps file's inode and device"
    justification: "S39 7, A4, F5"
