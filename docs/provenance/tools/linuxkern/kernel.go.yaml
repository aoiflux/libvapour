decisions:
  - rule: "Address width 32 with 4-byte pointers, 57 for an la57 paging mode, 48 otherwise; canonical form copies the top kept bit upwards"
    justification: "S54 4.1, A1, A2"
  - rule: "Pointers and symbols leave linuxkern masked; Mem reads at the canonical form"
    justification: "S54 4.1 step 3"
  - rule: "Read is exact; Readable reads every page; padded reads zero-fill pages that do not read"
    justification: "S54 4.2"
  - rule: "Shift from _text, else _stext, running less listed; else the first VMCOREINFO note that gives a layout"
    justification: "S54 4.6 step 2, T7, T8, M2"
  - rule: "Damaged VMCOREINFO copies are diagnostics, or a strict-mode error"
    justification: "S54 4.6 step 2"
  - rule: "Listing from names subtracts the shift only inside the image mapping"
    justification: "S54 4.6 step 3, T8, T9"
  - rule: "Names at an address in name order"
    justification: "S54 4.6 step 4"
