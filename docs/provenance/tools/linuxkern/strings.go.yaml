decisions:
  - rule: "At most count bytes a page at a time, ending at the first NUL"
    justification: "S54 4.5 step 1"
  - rule: "A needed page that does not read is an error, not a shorter string"
    justification: "S54 4.5 step 1"
  - rule: "Array strings need a declared length and 1-byte elements; a full array without a NUL is returned whole"
    justification: "S54 4.5 step 2, T6"
