decisions:
  - rule: "Member paths pass only through named structure members; offsets from the table"
    justification: "S54 4.3 step 1, T5"
  - rule: "Integer width: pointer width, else the table's member width, else the C width of the name, else the type size"
    justification: "S54 4.3 steps 3-4, L1, T1-T3, M1"
  - rule: "Bitfields read from their unit at the member offset, low bits first; bits outside the unit refused"
    justification: "S54 4.3 step 5, L3, L4, M1"
  - rule: "Signed unless unsigned by name, plain char, pointer or aggregate; enumerations signed; plain bitfields non-negative"
    justification: "S54 4.3 step 6, L1, L3, T4, O1-O3"
  - rule: "Pointers: pointer members or pointer-wide unsigned integers"
    justification: "S54 4.4 step 1, S06 F9"
  - rule: "Pointee size 0 for void, functions and unsized types"
    justification: "S54 4.4 step 2"
