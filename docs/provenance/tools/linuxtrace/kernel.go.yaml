decisions:
  - rule: "Addresses leave linuxtrace in canonical form; reads use the session memory as given"
    justification: "S54 4.1 step 3"
  - rule: "Integer, pointer, size, string and readability rules delegated to linuxkern's shared functions"
    justification: "S54 4.3-4.5, section 7"
  - rule: "Deref: set when non-zero once masked, and the whole pointee (one byte for size 0) reads"
    justification: "S54 4.4 step 3"
  - rule: "EnumField reads the member under the integer sign rule"
    justification: "S54 section 7, L1"
  - rule: "Walker gets the canonical form; the module model is built once"
    justification: "S54 4.7"
