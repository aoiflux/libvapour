decisions:
  - rule: "Sources are listed core, module, ftrace, BPF; no option selects all four"
    justification: "S62 KS1, 4 (list_symbols) step 1"
  - rule: "Core symbols come from the kallsyms tables found through VMCOREINFO, without a symbol table"
    justification: "S62 KS5, 4 step 2"
  - rule: "A core symbol with an empty name is not listed and is counted"
    justification: "S62 KS1, 5"
  - rule: "Core rows have an unknown export state; the letter case gives the binding"
    justification: "S62 KS2, KS4"
  - rule: "Module, ftrace and BPF rows come from the S38 lister, addresses canonical"
    justification: "S62 KS6, 4 step 3"
  - rule: "Strict mode fails on VMCOREINFO damage or any lister failure"
    justification: "S62 6 (list_symbols)"
