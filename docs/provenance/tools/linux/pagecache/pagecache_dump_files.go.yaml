decisions:
  - rule: "One gzip member of ustar headers with pax extended headers"
    justification: "S12 4.8 step 1, V4, V5"
  - rule: "Top directory per superblock <fstype>.<major>.<minor>, address added on a clash"
    justification: "S12 4.8 step 2, V2"
  - rule: "Directories, regular files with cached pages, and symlinks with a target; special mode bits dropped"
    justification: "S12 4.8 steps 3-4, F7, F8, O4, O6"
  - rule: "No member through a symlink member; duplicate names get the inode address"
    justification: "S12 4.8 steps 5-6"
  - rule: "Archive named by S00 kind pagecache, scope kernel, extension tar.gz"
    justification: "owner decision 2026-11-12, S12 O5"
  - rule: "The dump limit bounds each regular member and the sum of all regular members"
    justification: "owner decision 2026-11-12, S12 O8; S12 4.8 step 3, 8"
