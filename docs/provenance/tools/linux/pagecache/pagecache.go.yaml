decisions:
  - rule: "Superblocks from super_blocks; those without s_root skipped"
    justification: "S12 4.1, F1, F2"
  - rule: "A list that breaks forward is also walked backward from its head"
    justification: "S12 4.1 step 1, M3"
  - rule: "Mount views from s_mounts, namespace mounts only, initial namespace first, deepest root first"
    justification: "S12 4.2, F10, F11, F12"
  - rule: "Inodes from s_inodes; i_sb must be the superblock"
    justification: "S12 4.4, F5"
  - rule: "Name from the first i_dentry alias up d_parent to s_root; names 1-255 bytes without / or NUL"
    justification: "S12 4.3, F6, F9, V6"
  - rule: "Times in either layout; ctime loses I_CTIME_QUERIED; nanoseconds of 10^9 or more are absent"
    justification: "S12 4.4 step 4, F4"
  - rule: "Type names are the S_IF suffixes; mode string as the POSIX ls long format"
    justification: "S12 4.4 step 3, 7, V1, V3"
