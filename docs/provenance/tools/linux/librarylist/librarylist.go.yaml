decisions:
  - rule: "Each distinct non-zero DT_DEBUG of the process's images leads to one list"
    justification: "S61 4.10 step 2, L1, L2"
  - rule: "Entries seen or without a name pointer are skipped; empty names give no row"
    justification: "S61 4.10 step 3, M21"
  - rule: "A process whose lists give no row lists each file-backed area at vm_pgoff 0 that begins with an ELF header, executable left out, base from its program headers"
    justification: "owner decision 2026-11-12, S61 O6 and S77 O6; S61 4.10 steps 5-7, L3 to L5, M21"
  - rule: "Route marks which reading gave each row"
    justification: "owner decision 2026-11-12, S61 O6"
  - rule: "A list cut by a read failure, or whose last entry reads as zero bytes, also reads the mapped images; an image at a base a linker-list row has gives no row"
    justification: "owner decision 2026-11-12, follow-up N3 (S61 O14); S61 4.10 steps 5 and 7, M21e"
date: 2026-11-12
