decisions:
  - rule: "One row per filter entry; an empty filter is scope all; MOD-only filter is scope none; an unread hash is scope unread"
    justification: "S15b 4.3, F5, F6"
  - rule: "Owners through linuxmodule Lookup over the known modules; ModuleAddress is the struct module address"
    justification: "S15b 4.3, S07 4.4"
  - rule: "Strict mode fails on any walk, hash or module-view loss"
    justification: "S15b 6"
  - rule: "The release for the flag names is read from linux_banner only with show_ftrace_flags; an unread release is one diagnostic"
    justification: "owner decision 2026-11-12, S15b O1; S15b 4.5"
  - rule: "A trampoline is looked up like the callback: its owner module or kernel, else allocated code outside modules; empty without a module model"
    justification: "owner decision 2026-11-12, S15b O4; S15b 4.3 step 3, F11, F12"
