decisions:
  - rule: "The list is followed through next until ftrace_list_end; null, revisit and the cap stop it"
    justification: "S15b 4.2, F7"
  - rule: "Filters only when every func_hash, hash and entry member exists; otherwise scope all"
    justification: "S15b 4.1, F6"
  - rule: "A hash is empty when null, or count is 0 and FTRACE_HASH_FL_MOD is clear"
    justification: "S15b 4.4, F5"
  - rule: "Bucket count 1 << size_bits within the pointer width and MaxTableEntries; buckets walked with the S01 hlist walk"
    justification: "S15b 4.4, F3, F4"
  - rule: "Flag names by the running release: each name from the first checked tag that has it, bit 4 RECURSION_SAFE at v4.19 and RECURSION from v6.1, no name between; an unread release names only the bits every tag agrees on; others as bit N"
    justification: "owner decision 2026-11-12, S15b O1; S15b 4.5, F8"
