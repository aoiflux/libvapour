decisions:
  - rule: "Tables by symbol: sys_call_table, ia32_sys_call_table, x32_sys_call_table with 8-byte pointers; sys_call_table alone with 4-byte pointers"
    justification: "S11 4.1, T5, T7"
  - rule: "Length from a declared array type, else up to the next symbol with trailing read nulls dropped"
    justification: "S11 4.2, T2, M2"
  - rule: "Handler names prefer the table's stub prefix among names at one address"
    justification: "S11 4.4, T9, M1"
  - rule: "Dispatches is false when the table's switch dispatch function exists"
    justification: "S11 4.5, T5, T6"
