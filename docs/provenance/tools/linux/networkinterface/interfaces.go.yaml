decisions:
  - rule: "Devices and addresses come from the S40 readers; their row decisions are kept"
    justification: "S62 NI1, S40 7"
  - rule: "Operational state and reported flags drop the IF_OPER_ and IFF_ prefixes"
    justification: "S62 NI2, NI3"
  - rule: "A device whose dev_addr does not read is counted as not read and gives no row"
    justification: "S62 4, S40 7"
  - rule: "IPv4 and IPv6 walks are independent; a missing family is one diagnostic"
    justification: "S62 NI4"
  - rule: "Strict mode fails on any walk or device loss"
    justification: "S62 6"
date: 2026-11-12
