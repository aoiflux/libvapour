decisions:
  - rule: "Chain sources are the netns_nf arrays and net_device ingress/egress members the table types"
    justification: "S62 NH1, NH2, 4 step 1"
  - rule: "A chain block is a u16 count, the entries, then one registration pointer per entry"
    justification: "S62 NH4, NH5"
  - rule: "A count of 0 or above 1024 rejects the chain"
    justification: "S62 NH4"
  - rule: "Checks in order: registration unread, function differs, removed (accept_all), other chain, no owner, consistent"
    justification: "S62 NH3, NH5, NH7, 4 step 6"
  - rule: "Chains whose priorities do not ascend are counted"
    justification: "S62 NH5, 4 step 7"
