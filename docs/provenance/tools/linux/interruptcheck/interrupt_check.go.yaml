decisions:
  - rule: "All 256 vectors are reported, decoded from the table idt_descr names, compared byte for byte with idt_table"
    justification: "S10 4.2, 4.3, G1, K4, K5"
  - rule: "A typed gate_struct of another size than the mode's gate is unsupported"
    justification: "S10 4.1, K1"
  - rule: "Placement: kernel image by the shared lookup, then [_sinittext, _einittext), then the known modules, else unowned"
    justification: "S10 4.5, K10, K11, K12"
  - rule: "Modules are gathered only when a handler is outside the kernel image"
    justification: "S10 4.5 step 4, M3"
