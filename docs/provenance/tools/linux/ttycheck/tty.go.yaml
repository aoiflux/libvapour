decisions:
  - rule: "Drivers are the tty_drivers list walk over tty_driver.tty_drivers"
    justification: "S62 TT1, 4 step 1"
  - rule: "A null ttys table means a devpts driver with no rows"
    justification: "S62 TT3"
  - rule: "A slot's tty counts only when its index is the slot and its driver the driver"
    justification: "S62 TT4, 5"
  - rule: "Both receive_buf and receive_buf2 are reported, one row per set handler"
    justification: "S62 TT7, TT-O1"
  - rule: "Names are bounded by the 64-byte tty_struct.name array"
    justification: "S62 TT6, 8"
  - rule: "Slots per driver are capped at MaxTableEntries"
    justification: "S62 8"
