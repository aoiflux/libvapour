decisions:
  - rule: "An entry is three pointer-aligned words: a text line, a stamp that is '#' or NUL then 1 to 20 digits and is not the line, and unchecked data"
    justification: "owner decision 2026-11-12, S15c O1; S15c 4.3, H1, H4, H5, H6, M3, X1"
  - rule: "The history list is the longest null-ended array of entry pointers, lowest address on a tie"
    justification: "S15c 4.4, H1, H2, H3"
  - rule: "Stamp time: the digits as a signed 64-bit count of seconds since the Epoch in UTC; the stamp shown as stored, the digits alone for a NUL comment character"
    justification: "owner decision 2026-11-12, S15c O1; S15c 4.5, H5, H6, X2"
date: 2026-11-12
