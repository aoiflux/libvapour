decisions:
  - rule: "Processes chosen by the executable's base name (bash or sh) or by a mapped file named libreadline.so* or libhistory.so*, not by comm; PID filter applied; unread names counted in one diagnostic"
    justification: "owner decisions 2026-11-12, S15c O4 and O5; S15c 4.1, H7, H8, H9"
  - rule: "Memory searched: private writable areas (VM_WRITE set, VM_SHARED clear), capped by MaxRegionScanBytes"
    justification: "S15c 4.2, K2, H4"
  - rule: "Unread pages are counted, not strict errors"
    justification: "S15c 6"
