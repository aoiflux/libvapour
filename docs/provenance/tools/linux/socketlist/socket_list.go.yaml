decisions:
  - rule: "A file is a socket when f_op is socket_file_ops; private_data is its struct socket"
    justification: "S13 4 step 4, F1"
  - rule: "socket.file must be the file and sk.sk_socket the socket, else the socket is left out and counted"
    justification: "S13 5, F2, F3, M2"
  - rule: "A files_struct is listed once, under the first task holding it"
    justification: "S13 4 step 3, T2"
  - rule: "Inode number from the socket_alloc vfs_inode; 0 means it did not read"
    justification: "S13 4 step 4, F5"
  - rule: "Strict mode fails on task walk losses, counted losses and partial rows"
    justification: "S13 6"
