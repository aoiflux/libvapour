decisions:
  - rule: "Sock members read from the caller's reader, pointees from kernel space"
    justification: "S13 4.1"
  - rule: "Namespace from skc_net.net, or init_net when possible_net_t is empty"
    justification: "S13 4.1 step 2, F6"
  - rule: "Per-family fields as the S13 4.1 table; a missing family type gives the common fields only"
    justification: "S13 4.1 step 5, F4, I1-I2, U1-U5, L1-L4, P1-P2, X1, V1-V3, H1"
  - rule: "Filter: classic when orig_prog is set, else the eBPF id and name"
    justification: "S13 4.1 step 3, B1-B4"
  - rule: "Packet device by ifindex on the sock's namespace device list, walked once per namespace"
    justification: "S13 4.1 step 8, P2"
