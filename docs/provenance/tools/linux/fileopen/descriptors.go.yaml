decisions:
  - rule: "Every thread lists its own table in slot order; null slots and null tables give no rows"
    justification: "S62 FO1-FO3, 4 steps 2-4"
  - rule: "Slots that do not read keep the rows before them and are counted"
    justification: "S62 4 step 4, 6"
  - rule: "A path that is not built is empty, flagged PathUnresolved and counted"
    justification: "S62 4 step 6, S39 O8"
  - rule: "A missing type or member ends the tool; other read failures are counted"
    justification: "S62 6"
