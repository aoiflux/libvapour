decisions:
  - rule: "Needles are the eight sk_destruct functions and socket_file_ops"
    justification: "S62 SS1, SS6"
  - rule: "Only pointer-aligned words are compared"
    justification: "S62 SS4"
  - rule: "A destructor word is a sock only when the family matches the destructor and sk_type is a named SOCK_ value"
    justification: "S62 SS1 to SS3"
  - rule: "The link says whether sk_socket points back, is null, points elsewhere or does not read"
    justification: "S62 SS5, 4 step 4"
  - rule: "A file is followed only when its socket's sock points back at the socket"
    justification: "S62 SS6, 4 step 5"
  - rule: "Socks are decoded by the S13 decoder over physical memory; rows in physical order"
    justification: "S62 4 steps 6 and 7, S13 4.1"
