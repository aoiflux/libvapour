decisions:
  - rule: "Records are the ids from tail_id to head_id, at index id & (count - 1)"
    justification: "S09 4.3, R5, R7"
  - rule: "Only committed and finalized descriptors with a matching id are read; the bootstrap descriptor is not a record"
    justification: "S09 4.3, R6, R8, R15, O3"
  - rule: "Blocks found as get_data finds them, inside tail and head, with their own id, holding text_len bytes"
    justification: "S09 4.3, R9, R10, R11, R12, R16"
  - rule: "Header bounds count_bits 1-26, size_bits 1-31, ids less than count apart, data span at most size"
    justification: "S09 5, R13, R7, R16"
  - rule: "A record is final when its descriptor is finalized; committed records are read and marked not final"
    justification: "S09 4.3, R6, R8; owner decision 2026-11-12, S09 O3"
date: 2026-11-12
