decisions:
  - rule: "The layout is chosen from the root type's members (xa_head or rnode), never from a version"
    justification: "S02 R5, 4.1"
  - rule: "Fan-out is the slots array length and must be 16 or 64"
    justification: "S02 X3, R2, 4.1 step 5"
  - rule: "Tag bits are read from the raw slot value; the address form applies to the resulting address"
    justification: "S02 4.2"
  - rule: "A child's shift must be its parent's minus the chunk shift, else it is counted and not walked; a wrong parent, offset or owner is counted and walked"
    justification: "S02 X6, X7, R4, 4.3 step 3"
  - rule: "Entries and nodes are both capped at MaxTableEntries, depth at MaxRecursionDepth"
    justification: "S02 8"
  - rule: "An IDR needs idr_rt; idr_base is added when present"
    justification: "S02 I1, I2, 4.4"
date: 2026-11-11
