decisions:
  - rule: "User hives are the hives whose file name is NTUSER.DAT; every hive OpenEveryHive opens is considered"
    justification: "S44 2, D2, M1, O5"
  - rule: "Key path Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\UserAssist, GUID subkeys with Version and Count"
    justification: "S44 L1, D3, M2"
  - rule: "One row per Count value; no key or subkey rows; sort by hive path, address, subkey, name"
    justification: "S44 4 steps 3 and 5, 7, O8"
  - rule: "Values decoded only when 72 bytes long under Version 5 or an unread Version; others unmeasured with data"
    justification: "S44 5, M3, M5"
  - rule: "Unreadable key, incomplete lists, cut data, unmeasured version and out-of-range time are diagnostics; strict mode returns all rows and the first error"
    justification: "S44 6"
date: 2026-11-12
