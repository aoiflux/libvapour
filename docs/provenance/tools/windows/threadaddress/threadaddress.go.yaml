decisions:
  - rule: "Owner of a thread is the process at _KTHREAD.Process and must be in the unfiltered process list"
    justification: "S51 4.1 step 3, M6"
  - rule: "User address: bit 63 clear for 8-byte pointers, below 0x80000000 for 4-byte pointers"
    justification: "S51 4.1 step 4, F7"
  - rule: "Ranges walked once per owner; holding range has Start <= address <= End"
    justification: "S51 4.1 step 5"
  - rule: "Walk short when VadCount exceeds the ranges kept or SecureState's first word is nonzero"
    justification: "S51 4.1 step 6, T4, M6"
  - rule: "Export name only for an exact match in an image range, forwarders excluded, smallest name of aliases"
    justification: "S51 4.1 step 7, F9"
