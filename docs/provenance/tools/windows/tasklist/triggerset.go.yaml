decisions:
  - rule: "Triggers format 23; header with task flags (bit 22 Enabled), principal, account and a 0, 44 or 88-byte settings block"
    justification: "S37 M3, M5, M7, L2, L3, L3a"
  - rule: "Record kinds 0x6666, 0x7777, 0x8888, 0xAAAA, 0xCCCC, 0xDDDD, 0xEEEE, 0xFFFF only"
    justification: "S37 M6"
  - rule: "0xDDDD kind from the TASK_TRIGGER_TYPE schedule field: 0 Time, 1 Daily, 2 Weekly"
    justification: "S37 D4, D6, M8, L6"
  - rule: "0xFFFF Boot and 0xAAAA Logon from TaskCache Boot and Logon membership; 0x6666 WnfStateChange and 0xCCCC Event from XML copies; 0x7777 SessionStateChange from TASK_SESSION_STATE_CHANGE_TYPE values"
    justification: "S37 M12, M13, D7, 4 step 4"
  - rule: "0x8888 and 0xEEEE decode with no kind"
    justification: "S37 O1"
  - rule: "Boundary marker 1 is wall-clock time without a zone"
    justification: "S37 M9, O13"
  - rule: "Event-driven record layout, WNF tail without filler, event tail zero"
    justification: "S37 L5, L7"
date: 2026-11-12
