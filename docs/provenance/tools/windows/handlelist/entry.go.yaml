decisions:
  - rule: "Required ObjectPointerBits bit field and GrantedAccessBits inside an entry whose size divides a page"
    justification: "S66 H4.1, HT2"
  - rule: "In use when ObjectPointerBits nonzero; header is the bits shifted left 4 in canonical form at the resulting width"
    justification: "S66 H4.4 step 4, HT2, HD3, HM5"
  - rule: "Granted access is GrantedAccessBits (bits 0..24); NoRightsUpgrade is not access"
    justification: "S66 H4.4 step 4, HD2, HM7"
  - rule: "A page's LeafHandleValue must equal the value of its first entry"
    justification: "S66 H4.4 step 2, HM4"
