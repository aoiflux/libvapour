decisions:
  - rule: "Null ObjectTable: no handles, no diagnostic"
    justification: "S66 H4.2 step 1, HM1"
  - rule: "TableCode low two bits are the level, at most 2; the rest a 4 KB-aligned top page"
    justification: "S66 H4.2 step 2, HD1, HM2"
  - rule: "Pointer i covers values from i x 1024 per level; four values per entry"
    justification: "S66 H4.2 step 3, HM3"
  - rule: "Ceiling NextHandleNeedingPool when a nonzero page multiple below the limit, else MaxTableEntries x 4 capped at 2^24 x 4"
    justification: "S66 H4.3, HD1, HM3, HM6"
  - rule: "Pointers past the ceiling not followed and counted; pages unread or misplaced counted per table"
    justification: "S66 H4.3 step 2, H4.4, HM4, HM6, HM8"
  - rule: "First entry of each page skipped"
    justification: "S66 H4.4 step 3, HM4"
