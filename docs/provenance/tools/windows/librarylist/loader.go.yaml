decisions:
  - rule: "Native loader members from the kernel PDB types; DdagNode->LoadCount and LoadTime optional"
    justification: "S56 T1 to T3, 4.1 step 7"
  - rule: "32-bit loader layout re-lays the 64-bit member order with 4-byte pointers, checked against Learn's declarations"
    justification: "S56 L1, D1 to D3, M8"
  - rule: "All three loader lists walked with the S03 recovering walk; rows in load order, then memory-only, then initialization-only records"
    justification: "S56 4.1 steps 4 and 5, M2 to M4"
  - rule: "A record whose DllBase does not read is listed flagged BaseUnreadable, Base 0, and counted"
    justification: "owner decision 2026-11-12, S56 O8; S56 4.1 step 6, M5"
  - rule: "LoadTime read as FILETIME; 0 or top bit set is no time"
    justification: "S56 D6, M7"
