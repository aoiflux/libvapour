decisions:
  - rule: "Storage bit, directory slot, table slot and block offset; table pointer from Map; entry flags in the low four bits cleared"
    justification: "S49 4.3 steps 1-5, M5, M6, M12"
  - rule: "Only BlockOffset and PermanentBinAddress of a map entry are read"
    justification: "S49 4.3 step 4, M15, O11; owner decision 2026-11-12, follow-up R1"
  - rule: "Opt-in bin header check: hbin signature and FileOffset equal to the block offset less BlockOffset"
    justification: "S49 4.3 step 6, M6, M14, O10"
  - rule: "Negative size word marks an allocated cell; bodies read page by page with gaps; fixed members and names read apart"
    justification: "S49 4.5 steps 1-2, M7"
