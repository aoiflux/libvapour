decisions:
  - rule: "Name order: documented SID or pattern, service name, SAM account, profile folder, documented domain RID"
    justification: "S45 4.3, D5, D6, D7, M10-M12"
  - rule: "Service SID: SHA-1 of the upper-case UTF-16 name, five little-endian words under S-1-5-80"
    justification: "S45 4.3 step 2, D7, M10"
  - rule: "Account domain from the last 24 bytes of the V value of the SAM account domain key, accepted only as S-1-5-21 and three sub-authorities"
    justification: "S45 4.3 step 3, D4, M11, O4"
  - rule: "Profile folder: last component of ProfileImagePath under the SID-named ProfileList subkey"
    justification: "S45 4.3 step 4, M12, O5"
  - rule: "Unnamed SID marked when a source covering it did not read whole"
    justification: "S45 4.3 step 6"
date: 2026-11-12
