sources:
  - title: "ntoskrnl PDB types through the project's symbol tables: _EPROCESS.Token, _EX_FAST_REF, _TOKEN, _SID_AND_ATTRIBUTES, _SEP_TOKEN_PRIVILEGES, _SID, _SID_IDENTIFIER_AUTHORITY; builds 26100 (0D960CE103763A6097E839406D8B369F, 953A8DE880B0818C32DA2DEC1D79C2D9), 19045 (F57E740B088E5056E8AF0772F1CC5BEB), 14393 (3DFC5F7228304C26859E55E481700385)"
    path: tokenfacts -types
    accessed: 2026-11-12
  - title: "Microsoft Learn, TOKEN_USER (winnt.h), ms.date 2018-12-05"
    url: https://learn.microsoft.com/windows/win32/api/winnt/ns-winnt-token_user
    accessed: 2026-11-12
  - title: "Microsoft Learn, Virtual Address Spaces (Windows drivers), ms.date 2024-06-28"
    url: https://learn.microsoft.com/windows-hardware/drivers/gettingstarted/virtual-address-spaces
    accessed: 2026-11-12
  - title: "Project measurement: tokenfacts on mem1_win11, mem2_win10, mem5_server2016, mem6_server2025, mem7_server2025"
    path: tokenfacts
    accessed: 2026-11-12
decisions:
  - rule: "Token from _EPROCESS.Token with the _EX_FAST_REF.RefCnt bits cleared; nonzero and in system space"
    justification: "S45 4.1 steps 1-3, T1, D13, M1"
  - rule: "UserAndGroupCount at least 1 and at most MaxRowsPerObject; UserAndGroups at the token's VariablePart"
    justification: "S45 4.1 steps 4-5, D14, M2, M3"
  - rule: "RestrictedSids at the end of the group array; Capabilities in system space; each dropped alone on failure"
    justification: "S45 4.1 steps 6-7, M7"
  - rule: "SID entry: pointer nonzero in system space, Revision 1, SubAuthorityCount at most 15"
    justification: "S45 4.2 steps 1-3, D1, M5"
date: 2026-11-12
