decisions:
  - rule: "Partitions from PartitionTable and PartitionCount, capped by MaxTableEntries"
    justification: "S28 4.3 steps 1-2, M1, M2"
  - rule: "Each partition's endpoint table walked as 128 flat buckets with the S03 recovering walker; NumEntries checked"
    justification: "S28 4.3 steps 3-5, T1, M2, M3, O1"
  - rule: "Port pools from the compartment sets; 65,536-bit bitmap; entry at list + object + (port & 0xff) x entry size"
    justification: "S28 4.3 steps 6-7, D5, M5"
  - rule: "Two low entry bits are flags; only TCP entries with flags 2 start a listener chain"
    justification: "S28 4.3 step 7, M6, O3"
  - rule: "Chain through next members; local port must equal the bit"
    justification: "S28 4.3 step 8, M5, M7"
date: 2026-11-12
