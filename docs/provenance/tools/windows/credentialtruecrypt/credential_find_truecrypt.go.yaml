decisions:
  - rule: "Every rule is an owner decision: no allowed source documents the driver's cache; no capture holds the driver"
    justification: "S66 TD4, TM1, TO1"
  - rule: "Modules named truecrypt.sys, case ignored"
    justification: "S66 TD2, TO2"
  - rule: "Writable non-executable sections, span VirtualSize else SizeOfRawData within SizeOfImage, capped by MaxRegionScanBytes"
    justification: "S66 TD1, TO4"
  - rule: "4-byte aligned length from the minimum to 128, printable ASCII text, NUL; resume after the NUL"
    justification: "S66 TO3, TO5, TM3"
  - rule: "Minimum length 1 to 128, default 4"
    justification: "S66 TO3"
  - rule: "Unread headers a diagnostic, strict error; unread bytes scanned as zero and reported"
    justification: "S66 windows.credential.find_truecrypt 4 steps 3-4"
