decisions:
  - rule: "lsass.exe by image name without case, within the PID set; views of cryptdll.dll by the last path component"
    justification: "S23 4.1, F4, M1"
  - rule: "Table from the PDB publics CSystems and cCSystems, else from the export CDLocateCSystem's code"
    justification: "S23 4.3, M1, M2"
  - rule: "Count and table read through the process's page tables only, inside the view, count at most 0x17"
    justification: "S23 4.2, 4.4, M3, M7"
  - rule: "Home view is the file view holding the entry's name, else the cryptdll.dll view; a routine outside it is redirected"
    justification: "S23 4.5, M3, M4, O2"
  - rule: "Per-process failures are diagnostics; strict mode ends on the first one"
    justification: "S23 6"
