decisions:
  - rule: "Row schema named from the Learn vocabulary; registered tool names kept"
    justification: "S34 7, O6"
  - rule: "A running Win32 service takes its process ID and command line from a tagged image record; a stopped one has process ID 0"
    justification: "S34 4.6 step 3, D2, M8"
  - rule: "A driver's object name must begin with \\Driver\\ or \\FileSystem\\"
    justification: "S34 4.6 step 4, D3, M9"
  - rule: "An unmeasured build, or a build whose layout did not fit, is reported and refused in strict mode"
    justification: "S34 4.3 step 4, O2"
