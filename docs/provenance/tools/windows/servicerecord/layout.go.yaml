decisions:
  - rule: "Three record layouts named after the builds they were measured on, with tags, link, name, status, start type, error control and process-or-driver offsets"
    justification: "S34 4.2, M1, M3, O1"
  - rule: "Head forms: a CServiceDatabase global with first, last, counter and count, or a _SERVICE_RECORD sentinel whose next link is the first record"
    justification: "S34 4.2, P1, P2, M5"
  - rule: "Image records carry their tag at +0 and the command line at +0x18; process ID offset per layout"
    justification: "S34 4.2, M8"
