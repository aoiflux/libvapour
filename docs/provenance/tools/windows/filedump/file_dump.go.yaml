decisions:
  - rule: "File object: Type 5, Size the size of _FILE_OBJECT, device readable"
    justification: "S19 4.1 step 2, D1, T1, M1"
  - rule: "Device filter by documented device types that hold files"
    justification: "S19 4.1 step 3, D3, M1, O1"
  - rule: "One carve per SectionObjectPointer"
    justification: "S19 4.1 step 4, D2"
  - rule: "Control area: segment points back, File set, Image matches the pointer, FilePointer names a file object of the stream"
    justification: "S19 4.2, T2, T3, M3, O2"
  - rule: "File size from the cache map, else the FsContext header; pieces past it left out"
    justification: "S19 4.1 step 6, 4.5, M6"
  - rule: "A FsContext header FileSize of 0 is an unknown size"
    justification: "owner decision 2026-11-12, follow-up Mem-M9; S19 4.1 step 6, O9"
  - rule: "Control areas with BeingDeleted set are carved and flagged; a null FilePointer is accepted only for them"
    justification: "owner decision 2026-11-12, S19 O2"
date: 2026-11-12
