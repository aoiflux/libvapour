decisions:
  - rule: "Cache map: NodeTypeCode 0x2FF, NodeByteSize the type's size, 0 <= FileSize <= SectionSize, SectionSize a 256 KB multiple, FileObjectFastRef of the stream"
    justification: "S19 4.4 steps 1-3, D4, M7, O5"
  - rule: "Views from the VACB arrays named by CcVacbArrays, offset the Overlay quadword rounded down to 256 KB"
    justification: "S19 4.4 step 4, D4, M8, M9"
  - rule: "Views misaligned or repeated are dropped; views past FileSize are ignored"
    justification: "S19 4.4 step 5, D4, M8"
