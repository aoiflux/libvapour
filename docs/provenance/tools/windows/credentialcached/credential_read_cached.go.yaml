decisions:
  - rule: "Slots are NL$ followed by decimal digits without a leading zero; NL$Control and NL$IterationCount are not slots"
    justification: "S22 4.1 step 3, M1"
  - rule: "The system key, policy key list and NL$KM are read only when a used slot exists; failure then fails the run"
    justification: "S22 4.2, M4, M5"
  - rule: "A slot that does not decode is a diagnostic, not a row; rows sorted by slot number; the raw iteration value is carried"
    justification: "S22 4.1, 4.4, 6, 7"
