decisions:
  - rule: "Key 0 is a never-used slot"
    justification: "S52 4.2 step 2, D1, M2"
  - rule: "Va bit 0 is the freed mark; address is Va with bit 0 cleared"
    justification: "S52 4.2 step 3, M2, M3, M4, O1"
  - rule: "Tag from the lowest Key byte, trailing zeros dropped, other bytes outside 0x20-0x7e escaped"
    justification: "S52 4.2 step 4, D1, M8"
  - rule: "PoolType: exact enum name, shortest among shared values, else decimal; parity gives paged or nonpaged"
    justification: "S52 4.3 step 1, D4, T4, O3"
  - rule: "PoolFlags: POOL_FLAGS names in bit order with a hex remainder; exactly one of 0x40, 0x80, 0x100 gives the kind"
    justification: "S52 4.3 step 2, D3, M9, O2"
  - rule: "Order by address, in use before freed, then slot"
    justification: "S52 4.4 step 4"
