decisions:
  - rule: "Hives picked by registry path, then by file name; _Classes hives skipped; first SOFTWARE and SYSTEM hive used"
    justification: "S56 4.2 step 1, D9, D15, M13"
  - rule: "Locations only from Microsoft Learn pages: Run, RunOnce, RunServicesOnce, Wow6432Node Run and RunOnce, policy Run, Winlogon Shell and Userinit, AppInit values, Image File Execution Options Debugger, BootExecute"
    justification: "S56 4.2 table, D8 to D14"
  - rule: "RunOnce ! and * prefixes are flags; the name is kept"
    justification: "S56 D8"
  - rule: "BootExecute from the current control set; an unread Select Current skips it"
    justification: "S56 4.2 step 5"
  - rule: "Named values with empty data are returned"
    justification: "S56 O6"
  - rule: "Unreadable keys and incomplete lists are diagnostics; strict mode returns the first after all rows"
    justification: "S56 6"
