decisions:
  - rule: "Walk _EPROCESS.ThreadListHead with the S03 recovering walker; the executive list holds every kernel-list thread plus terminated ones"
    justification: "S50 4.2 steps 1-2, M1"
  - rule: "A thread whose UniqueThread does not read is left out; strict mode fails"
    justification: "S50 4.2 step 3"
  - rule: "The S17 thread check only reports on listed threads"
    justification: "S50 4.2 step 4, M2, O4"
  - rule: "State and wait reason named from the table's _KTHREAD_STATE and _KWAIT_REASON; SuspendCount and Priority signed"
    justification: "S50 4.3 step 5, T3, T6, D1-D3"
