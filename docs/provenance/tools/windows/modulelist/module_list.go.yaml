    accessed: 2026-11-12
  - title: "Project measurement: kmodfacts -types, -raw -list and -tool -pid 0 on mem1_win11, mem2_win10, mem5_server2016, mem6_server2025, mem7_server2025"
    path: kmodfacts
    accessed: 2026-11-12
  - title: "Spec S03: Windows list entries and the kernel build (shared walker)"
    path: docs/specs/S03-windows-list-entry-and-build.md
