decisions:
  - rule: "_KLDR_DATA_TABLE_ENTRY first, _LDR_DATA_TABLE_ENTRY when the table lacks it; four required members, FullDllName optional"
    justification: "S55 4.1 steps 1-2, T1, T2"
  - rule: "SizeOfImage read at the table's width, 4 bytes when it gives none"
    justification: "S55 4.1 step 2, T1"
  - rule: "PsLoadedModuleList walked with the S03 recovering walk; Blink-found entries counted in a diagnostic"
    justification: "S55 4.1 step 3, M1, O6"
  - rule: "Unread members flagged, row kept; walk order, no sort"
    justification: "S55 4.1 steps 4 and 6"
  - rule: "Module carries Regions and SeparateRegions for Linux rows"
    justification: "owner decision 2026-11-12, S55 O5; S55 7"
