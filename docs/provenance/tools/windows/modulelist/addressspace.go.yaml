decisions:
  - rule: "Address mask 32, 48 or 57 bits by pointer width and paging mode"
    justification: "S55 4.3 step 1, D3, D4"
  - rule: "Canonical form sign-extends the top translated bit on 64-bit tables"
    justification: "S55 4.3 step 2, D3"
  - rule: "Upper half 0x80000000 or the lowest canonical address with the top bit set"
    justification: "S55 4.3 step 3, D2, D3"
  - rule: "MmSystemRangeStart preferred; unread or out-of-range values replaced by the upper half"
    justification: "S55 4.3 step 4, D1, M2"
  - rule: "Base below system space or SizeOfImage 0 reported, row kept"
    justification: "S55 4.1 step 5, M2, M3"
