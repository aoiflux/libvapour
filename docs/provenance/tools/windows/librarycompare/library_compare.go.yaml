decisions:
  - rule: "One row per VAD of kind image, at the view's start"
    justification: "S66 LD1, LT2, LM1"
  - rule: "Membership is the union of the lists of the loader records at that base, 32-bit when any record is"
    justification: "S66 LD2, LT1, LM4"
  - rule: "A start seen twice keeps the first view; unknown kinds counted, not compared"
    justification: "S66 LM1"
  - rule: "Process without loader records: rows flagged LoaderListsEmpty, diagnostic"
    justification: "S66 LM5"
  - rule: "WoW64 process without 32-bit records, and records without an image view, reported"
    justification: "S66 LD3, LM3, LM7, LO3"
  - rule: "VAD tree that does not read: process skipped, strict failure"
    justification: "S66 windows.library.compare 4 step 4"
  - rule: "Process list order, then base"
    justification: "S66 windows.library.compare 4 step 9"
  - rule: "Loader records whose DllBase does not read take no part in the comparison"
    justification: "owner decision 2026-11-12, S56 O8"
