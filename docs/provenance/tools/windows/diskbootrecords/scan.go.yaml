sources:
  - title: "Project measurement: petoolfacts -tool diskbootrecords,imagecrashheader,imagestrings on mem1_win11, mem2_win10, mem5_server2016, mem6_server2025, mem7_server2025"
    path: petoolfacts
    accessed: 2026-11-12
decisions:
  - rule: "Every byte offset scanned, not only sector-aligned ones"
    justification: "S66 BM1"
  - rule: "Chunks carry 511 bytes of the previous chunk so a record across a chunk end is seen once"
    justification: "S66 windows.disk.scan_boot_records 4 step 2"
  - rule: "A chunk that does not read is read page by page; records on unread pages are counted, not decoded"
    justification: "S66 windows.disk.scan_boot_records 4 step 2, 6"
date: 2026-11-12
