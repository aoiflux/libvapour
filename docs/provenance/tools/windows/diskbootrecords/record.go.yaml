  - title: "Project measurement: petoolfacts -tool diskbootrecords,imagecrashheader,imagestrings on mem1_win11, mem2_win10, mem5_server2016, mem6_server2025, mem7_server2025"
    path: petoolfacts
    accessed: 2026-11-12
decisions:
  - rule: "Record layout: boot code to 0x1B8, signature at 0x1B8, four 16-byte entries at 0x1BE, 0x55AA at 0x1FE"
    justification: "S66 BD1, BD2"
  - rule: "CHS sector in bits 0-5, cylinder top bits in bits 6-7 of the sector byte"
    justification: "S66 BD3"
  - rule: "Table rules: indicator 0x00 or 0x80, unused entries zero, in-use entries nonempty, after sector 0, within 2^32 sectors, CHS sectors from 1, no overlap, at most one active, one in use"
    justification: "S66 BD2-BD6, BM2, BM3"
