decisions:
  - rule: "The link scan gives the object scan kernel memory for names"
    justification: "owner decision 2026-11-12, follow-up P4 (S69 4.2 step 1, S31 O10)"
  - rule: "Flags bit 0x10 marks a callback link whose routine must be in system space"
    justification: "S69 4.2 step 2, T3, M6, O4"
  - rule: "LinkTarget lengths must be even and not above MaximumLength; unreadable or non-printable targets flagged"
    justification: "S69 4.2 step 3, D8, M5"
  - rule: "Link names are one namespace component"
    justification: "S69 4.2 step 5, M5"
  - rule: "A body with neither a readable target nor a readable name is refused"
    justification: "S69 4.2 step 6"
  - rule: "Callback routines attributed to kernel modules"
    justification: "S69 4.2 step 7"
