decisions:
  - rule: "A line is optional blanks, a decimal offset, one blank or tab, and a non-empty string; CR before LF dropped"
    justification: "S66 GD1, windows.image.map_strings 4 step 2-3"
  - rule: "Text kept as UTF-8 when valid, else each byte as a Latin-1 rune"
    justification: "S66 windows.image.map_strings 4 step 3, GO3"
  - rule: "Lines past MaxTextBytes rejected; more lines than MaxRowsPerObject is an error"
    justification: "S66 8, GO4"
