decisions:
  - rule: "Signature FILE; update sequence array even, at or past 0x2A, ending before the last word of the first sector"
    justification: "S42 4.2 step 1, D1, D2"
  - rule: "Record size from the size field as a count of words, 1024 to 4096 bytes"
    justification: "S42 4.2 step 2, D1, M2, O1"
  - rule: "Stride tails equal to the sequence number are restored from the array; form from strides inside the used bytes only"
    justification: "S42 4.2 step 4, 4.4, D1, M3, M4, O3"
  - rule: "Segment number at 0x2C only when the array is at 0x30 or later"
    justification: "S42 4.2 step 5, M5, O4"
  - rule: "Attribute walk: quadword-aligned first offset, non-decreasing type codes, form 0 or 1, length per form, name and value inside, end marker required"
    justification: "S42 4.3, D3, D7, M6"
  - rule: "$STANDARD_INFORMATION resident with value >= 0x30; $FILE_NAME resident with value >= 0x42, name inside, known flags only; four FILETIME slots"
    justification: "S42 4.5, D4, D5, D8, D9, M7, M8, O2"
  - rule: "Record name: FILE_NAME_NTFS first, then neither flag, then DOS only"
    justification: "S42 4.5 step 4, D5, D11"
  - rule: "Link count at 0x12 and the dwords at 0x18 and 0x1C read as measured fields"
    justification: "owner decision 2026-11-12, S42 O9"
date: 2026-11-12
