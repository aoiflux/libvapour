decisions:
  - rule: "Six views: active list, kernel process list, session rings, pool scan, thread owners, csrss.exe handles"
    justification: "S26 4.1, T1-T3, M1-M6"
  - rule: "Every candidate passes the S17 check; rows keyed by physical address, untranslated ones by virtual address"
    justification: "S26 4.2, D4"
  - rule: "Verdict order listed, exited, copy, unlisted, hidden"
    justification: "S26 4.3, D1, D2, M3, M4, O2"
  - rule: "Copy: same PID, name, kernel root and creation time as a listed process"
    justification: "S26 4.3, D2, M3"
  - rule: "A failed view is left out with a diagnostic, an error in strict mode unless the table lacks its member"
    justification: "S26 4.1, 6"
