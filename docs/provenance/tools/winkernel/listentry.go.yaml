decisions:
  - rule: "Forward walk test order: head, null, cycle, unreadable, back-link, limit"
    justification: "S03 4.3; a link back to an earlier entry is reported as a cycle"
  - rule: "An entry whose Blink is not the entry before it is not listed"
    justification: "S03 L4, 4.3 step 2.6; Windows refuses to operate on such an entry"
  - rule: "The recovering walk runs backward only after a non-limit break with a Blink, stops without a break on meeting a forward entry, and shares one limit"
    justification: "S03 4.4"
  - rule: "Strict mode returns the first break and no entries; otherwise each break is reported once"
    justification: "S03 4.5"
  - rule: "An unreadable head is an error in every mode"
    justification: "S03 4.3 step 1"
  - rule: "Container is entry minus offset, absent below the offset"
    justification: "S03 L7, 4.6"
date: 2026-11-11
