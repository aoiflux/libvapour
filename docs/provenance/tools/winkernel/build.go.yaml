decisions:
  - rule: "Shared data at 0xFFFFF78000000000 for 8-byte pointers, 0xFFDF0000 for 4-byte"
    justification: "S03 B1, 4.7 step 1; ARM32 and the relocatable build out of scope (O3)"
  - rule: "NT version read only when both members read; else both 0"
    justification: "S03 4.7 step 2"
  - rule: "Kernel build is the low 28 bits of the NtBuildNumber global, decoration the top 4"
    justification: "S03 4.7 step 4; open point O1"
  - rule: "Values returned as read; callers judge plausibility"
    justification: "S03 4.7 step 5"
  - rule: "Builds 19042-19045 map to file-set build 19041; every other build maps to itself"
    justification: "S03 B7, B8, 4.9; owner decision 2026-11-11"
