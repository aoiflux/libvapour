decisions:
  - rule: "Kernel root from the identification's DTB (crash dump header or processor start page), else the System process scan"
    justification: "S76 4.2 step 3, M3"
  - rule: "System process scan runs only when the root or a confirmed base needs it"
    justification: "S76 4.2, M3"
  - rule: "Paging mode from S04 on the root, 4-level when undecided; every process walked in the kernel's mode"
    justification: "S76 4.2 step 4, F1, M4"
  - rule: "Pagefiles opened only when CheckPagefilePTELayout accepts the table"
    justification: "S76 4.2 step 5, S53 4.3"
  - rule: "Base candidates cheapest first: identification base, list Blink, process list, image scan, debugger data block scan"
    justification: "S76 4.3, S53 9.2"
  - rule: "tcpip layout merged as extra types when one is measured for the build"
    justification: "S76 4.7"
  - rule: "Strict mode refuses an unconfirmed base, no base, or a table needing a base with no build to check it against"
    justification: "owner decision 2026-11-12, S76 O4"
date: 2026-11-12
