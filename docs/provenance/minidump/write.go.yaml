decisions:
  - rule: "Header, directory, SystemInfo, ModuleList, ThreadList, ThreadInfoList always; HandleData, MemoryInfoList when there are entries; Memory64List last with the memory bytes behind BaseRva"
    justification: "S73 4.1 steps 1-7, F1, F11, F12"
  - rule: "A process with no thread gets one placeholder thread flagged MINIDUMP_THREAD_INFO_ERROR_THREAD"
    justification: "S73 4.1 step 4, F8, D2, O8"
  - rule: "Header Flags derived from the streams written; MiniDumpWithFullMemory always"
    justification: "S73 4.1 step 8, F3, D1"
  - rule: "Regions sorted; empty, wrapping, overlapping or undefined-state regions refused; only committed dumpable regions written"
    justification: "S73 4.1 step 1, F10, W1-W4"
  - rule: "Stack descriptor points into the memory data only when the stack lies in address-contiguous written ranges below 4 GiB"
    justification: "S73 4.1 step 6, F7"
  - rule: "Reader results cut or padded to the requested length, padding recorded as gaps"
    justification: "S73 4.1 step 9"
date: 2026-11-12
