sources:
  - title: "System V Application Binary Interface, generic ABI, DRAFT 10 June 2013: ELF Header, Sections, Program Header, Note Section"
    url: http://www.sco.com/developers/gabi/latest/contents.html
    accessed: 2026-11-12
  - title: "include/uapi/linux/elf.h at v4.19, v6.1, v6.4, v6.14, v6.17 (ET_CORE, PT_LOAD, PT_NOTE, PN_XNUM, NT_* types)"
