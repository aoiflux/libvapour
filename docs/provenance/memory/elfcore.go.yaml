    accessed: 2026-11-12
  - title: "fs/binfmt_elf.c at v4.19, v6.1, v6.4, v6.14, v6.17 (process core notes, p_paddr 0, 4-byte note alignment, extended program header numbering)"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/fs/binfmt_elf.c?h=v6.17
    accessed: 2026-11-12
  - title: "kernel/kexec_file.c at v4.19, v6.1, v6.4 and kernel/crash_core.c at v6.14, v6.17 (crash kernel ELF header: kernel text mapped twice)"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/kernel/crash_core.c?h=v6.17
    accessed: 2026-11-12
  - title: "fs/proc/kcore.c at v4.19, v6.1, v6.4, v6.14, v6.17 (p_paddr for RAM, text, and (elf_addr_t)-1 otherwise; notes)"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/fs/proc/kcore.c?h=v6.17
    accessed: 2026-11-12
  - title: "fs/proc/vmcore.c at v4.19, v6.1, v6.4, v6.14, v6.17; include/linux/crash_core.h at v4.19, v6.1, v6.4; include/linux/vmcore_info.h at v6.14, v6.17 (VMCOREINFO note name, note walk)"
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/fs/proc/vmcore.c?h=v6.17
    accessed: 2026-11-12
  - title: "Project measurement: capturefacts on mem1_win11, mem2_win10, mem5_server2016, mem6_server2025, mem7_server2025, mem3_ubuntu24, mem4_fedora40, the process region captures, a minidump and a debugger-written process core"
    path: "capturefacts"
    accessed: 2026-11-12
decisions:
  - rule: "ET_CORE in either class and byte order; PN_XNUM count from section header 0"
    justification: "S71 4.9 steps 1-2, E1, E1a, E2"
  - rule: "VMCOREINFO marks a kernel capture; CORE NT_AUXV, NT_SIGINFO or NT_FILE without it is ErrProcessCore"
    justification: "S71 4.9 step 4, E4, E5, E6, C8"
  - rule: "Notes 4-aligned, 8 when p_align is 8; walk ends at namesz 0; note and segment caps"
    justification: "S71 4.9 step 3, E2, E5, E6"
  - rule: "p_paddr all ones left out; nested segments are the same memory and left out; partial overlap refused; only p_filesz mapped"
    justification: "S71 4.9 steps 5-6, E3, E4, O6"
date: 2026-11-12
