decisions:
  - rule: "Header 0x2000 bytes, pages follow in run order"
    justification: "S71 4.7 steps 2, 7, 8, W1, C5"
  - rule: "Field offsets measured; descriptor layout from the PDB; 1 to 503 runs"
    justification: "S71 4.7 step 3, W2, C2, C3, O1"
  - rule: "Fields from DumpType on only when the run array ends at or before 0xF98; DumpType must be 1"
    justification: "S71 4.7 step 4, W1, C3, C4"
  - rule: "Run 240 recounted from the page total only when the counts disagree and the recount fits before run 241"
    justification: "S71 4.7 step 5, C4, O2"
  - rule: "32-bit dumps refused"
    justification: "S71 4.7 step 1, O3"
  - rule: "Recounted runs and zero tails are kept as repairs, apart from other container notes, so strict mode can refuse them"
    justification: "owner decision 2026-11-12, S71 O7"
