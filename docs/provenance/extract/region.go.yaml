sources:
  - title: "Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 2A FXSAVE (512-byte save area) and Vol. 3A 4.5 (4-KByte pages)"
    url: https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html
