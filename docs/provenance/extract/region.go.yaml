decisions:
  - rule: "Region end is the last byte; size end-start+1; reversed or whole-space ranges refused"
    justification: "S73 4.3 step 1, R1"
  - rule: "One read of the whole range, then page by page on failure; unread pages zero-filled and recorded as merged absolute gaps"
    justification: "S73 4.3 steps 2-3, I2"
  - rule: "Copies in 1 MiB chunks; size over the limit refused before any write"
    justification: "S73 4.3 step 4, R2"
date: 2026-11-12
